[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-ofa"
version = "0.1.0"
description = "Geometry-aware coupled sampling for Shapley-specific OFA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
include = ["frame_ofa*"]
